services: 
  nn1: 
    image: apache/hadoop:3.5.0 
    container_name: hd_nn1 
    hostname: nn1 
    user: root 
    ports: 
           - "9871:9870" 
           - "8021:8020" 
    volumes: 
           - nn1_data:/data/name 
           - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro 
           - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro 
           - ./scripts/start-namenode.sh:/scripts/start-namenode.sh:ro 
    command: 
           - /bin/bash 
           - /scripts/start-namenode.sh 
    networks: 
           - hadoop2 
    restart: unless-stopped

  nn2: 
    image: apache/hadoop:3.5.0 
    container_name: hd_nn2 
    hostname: nn2 
    user: root 
    ports: 
